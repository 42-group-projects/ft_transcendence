
services:
  # PostgreSQL
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private-network
    restart: unless-stopped

  # Socket.io
  socket-server:
    build:
      context: ./socket_server
      dockerfile: Dockerfile
    ports:
      - "${NEXT_PUBLIC_SOCKET_PORT}:${NEXT_PUBLIC_SOCKET_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${NEXT_PUBLIC_SOCKET_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - RECONNECT_GRACE_MS=${RECONNECT_GRACE_MS:-30000}
    volumes:
      - ./socket_server:/app
      - /app/node_modules
    networks:
      - game-network
    restart: unless-stopped

  # Production Web API server (Hono)
  api-server:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-4001}:4001"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=4001
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./api_server:/app
      - /app/node_modules
    networks:
      - game-network
    restart: unless-stopped

  # Mock REST API (Hono) — kept for comparison/testing during migration
  mock-server:
    build:
      context: ./mock_server
      dockerfile: Dockerfile
    ports:
      - "${MOCK_API_PORT:-4000}:4000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./mock_server:/app
      - /app/node_modules
    networks:
      - game-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - game-network
    depends_on:
      - socket-server
      - mock-server
    restart: unless-stopped

networks:
  game-network:
    driver: bridge
  private-network:
    driver: bridge
    internal: true

volumes:
  postgres-data: