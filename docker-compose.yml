
services:
  # PostgreSQL
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private-network
    restart: unless-stopped

  # Socket.io
  socket-server:
    build:
      context: ./socket_server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${SOCKET_PORT}
    volumes:
      - ./socket_server:/app
      - /app/node_modules
    networks:
      - game-network
    restart: unless-stopped
 
  #Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - game-network
    depends_on:
      - socket-server
    restart: unless-stopped
 
networks:
  game-network:
    driver: bridge
  private-network:
    driver: bridge
    internal: true

volumes:
  postgres-data: