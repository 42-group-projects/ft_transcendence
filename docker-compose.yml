services:
    # PostgreSQL
    postgres:
        build:
            context: ./database
            dockerfile: Dockerfile
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - game-network
            - private-network
        restart: unless-stopped

    # Socket.io — served over WSS; the browser connects to it directly.
    socket-server:
        build:
            context: ./socket_server
            dockerfile: Dockerfile
        ports:
            - '${NEXT_PUBLIC_SOCKET_PORT}:${NEXT_PUBLIC_SOCKET_PORT}'
        environment:
            - NODE_ENV=${NODE_ENV}
            - PORT=${NEXT_PUBLIC_SOCKET_PORT}
            - JWT_SECRET=${JWT_SECRET}
            - INTERNAL_SECRET=${INTERNAL_SECRET}
            - RECONNECT_GRACE_MS=${RECONNECT_GRACE_MS:-30000}
            - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-https://localhost:3000}
            - TLS_KEY_PATH=/certs/key.pem
            - TLS_CERT_PATH=/certs/cert.pem
        volumes:
            - ./socket_server:/app
            - /app/node_modules
            - ./certs:/certs:ro
        networks:
            - game-network
        restart: unless-stopped

    # Web API server (Hono) — not exposed to the host; the browser reaches it
    # only through the frontend's /api rewrite over the internal network.
    api-server:
        build:
            context: ./api_server
            dockerfile: Dockerfile
        environment:
            - NODE_ENV=${NODE_ENV}
            - PORT=4001
            - JWT_SECRET=${JWT_SECRET}
            - INTERNAL_SECRET=${INTERNAL_SECRET}
            - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-https://localhost:3000}
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        volumes:
            - ./api_server:/app
            - /app/node_modules
        networks:
            - game-network
            - private-network
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    # Frontend (Next.js) — served over HTTPS via next dev --experimental-https.
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        command:
            - pnpm
            - dev
            - -H
            - 0.0.0.0
            - --experimental-https
            - --experimental-https-key
            - /certs/key.pem
            - --experimental-https-cert
            - /certs/cert.pem
        ports:
            - '3000:3000'
        environment:
            - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-https://localhost:3001}
            - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
            - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api-server:4001}
        volumes:
            - ./frontend:/app
            - /app/node_modules
            - ./certs:/certs:ro
        networks:
            - game-network
        depends_on:
            - socket-server
            - api-server
        restart: unless-stopped

networks:
    game-network:
        driver: bridge
    private-network:
        driver: bridge
        internal: true

volumes:
    postgres-data:
